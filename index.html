<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乐高体素海岛 · 豪华探索版 | Voxel LEGO Island</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loader">
    <div class="lego-spinner">
      <div class="lego-brick-dot"></div>
      <div class="lego-brick-dot"></div>
      <div class="lego-brick-dot"></div>
      <div class="lego-brick-dot"></div>
    </div>
    <div id="loader-text">正在拼装乐高体素海岛豪华版…</div>
  </div>

  <!-- Flash overlay for lightning & postcard snapshot -->
  <div id="screen-flash"></div>

  <!-- 3D WebGL Canvas Mount -->
  <div id="canvas-container"></div>

  <!-- Floating Toast Notifications -->
  <div id="toast-container"></div>

  <!-- HUD Layer -->
  <div class="hud" id="hud">
    <!-- Top Left: Brand, Stats & Treasure Hunt -->
    <div class="glass-panel top-left hud-hideable">
      <div class="brand-row">
        <div class="brand-icon">🏝️</div>
        <div>
          <div class="brand-title">乐高体素海岛 · 豪华版</div>
          <div class="brand-sub">
            <span class="pill" id="stat-bricks">🧱 0 块</span>
            <span class="pill" id="stat-studs">⚪ 0 凸点</span>
            <span class="pill treasure-pill" id="stat-chests" title="在海岛各处寻找发光的乐高金宝箱">💎 宝箱 0/5</span>
          </div>
        </div>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="explore">🧭 自由漫游</button>
        <button class="mode-tab" data-mode="build">🧱 拼装积木</button>
        <button class="mode-tab" data-mode="sail">⛵ 亲自开船</button>
      </div>
    </div>

    <!-- Top Right: Action & Toggle Buttons -->
    <div class="top-right">
      <button class="icon-btn hud-hideable" id="btn-audio" title="开关沉浸式程序合成音效">🔇 <span class="label">音效</span></button>
      <button class="icon-btn hud-hideable" id="btn-volcano" title="切换雪山 / 活火山喷发模式">🌋 <span class="label">火山</span></button>
      <button class="icon-btn active hud-hideable" id="btn-aurora" title="开关夜空极光与流星雨">🌌 <span class="label">极光</span></button>
      <button class="icon-btn hud-hideable" id="btn-firework" title="发射体素烟花">🎆 <span class="label">烟花</span></button>
      <button class="icon-btn hud-hideable" id="btn-photo" title="导出高清明信片 PNG">📸 <span class="label">明信片</span></button>
      <button class="icon-btn active hud-hideable" id="btn-studs" title="开关乐高凸点">⚪ <span class="label">凸点</span></button>
      <button class="icon-btn active hud-hideable" id="btn-rotate" title="自动缓慢环绕">🔄 <span class="label">环绕</span></button>
      <button class="icon-btn" id="btn-zen" title="纯净视角（隐藏界面）">👁️ <span class="label">纯净</span></button>
    </div>

    <!-- Contextual Bar: Build Mode Brick Palette -->
    <div class="glass-panel context-bar hud-hideable hidden" id="build-bar">
      <div class="context-header">
        <span class="context-title">🧱 拼装模式：左键叠放积木 · 右键拆除 · 滚轮缩放</span>
        <div class="context-actions">
          <span class="pill" id="stat-built">已拼 0 块</span>
          <button class="mini-btn" id="btn-build-undo" title="撤销上一块 (Ctrl+Z)">↩ 撤销</button>
          <button class="mini-btn danger" id="btn-build-clear" title="清空所有自建积木">🗑️ 清空</button>
        </div>
      </div>
      <div class="swatch-row" id="build-swatches"></div>
    </div>

    <!-- Contextual Bar: Sail Mode Controls -->
    <div class="glass-panel context-bar hud-hideable hidden" id="sail-bar">
      <div class="sail-row">
        <span class="context-title">⛵ 航海模式：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键掌舵 · <kbd>Space</kbd> 鸣笛放信号弹</span>
        <div class="sail-controls">
          <span class="pill" id="stat-speed">航速 0.0 节</span>
          <button class="mini-btn" id="btn-sail-horn">📯 鸣笛</button>
          <button class="mini-btn" id="btn-sail-exit">退出开船</button>
        </div>
      </div>
    </div>

    <!-- Bottom Control Dock -->
    <div class="glass-panel bottom-dock hud-hideable">
      <!-- Row 1: Time of Day + Time Presets -->
      <div class="dock-row">
        <div class="time-block">
          <button class="play-btn" id="btn-play" title="播放/暂停昼夜循环">⏸</button>
          <div class="clock-label" id="clock-label">☀️ 10:20 上午</div>
          <input type="range" class="time-slider" id="time-slider" min="0" max="24" step="0.02" value="10.2" />
        </div>
        <div class="preset-group">
          <button class="chip-btn" data-time="6.1">🌅 黎明</button>
          <button class="chip-btn" data-time="12.5">☀️ 正午</button>
          <button class="chip-btn" data-time="17.85">🌇 日落</button>
          <button class="chip-btn" data-time="22.6">🌙 星空</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Row 2: Weather Selector + Camera Viewpoints -->
      <div class="dock-row">
        <div class="preset-group" id="weather-presets">
          <button class="chip-btn active" data-weather="clear">☀️ 晴朗</button>
          <button class="chip-btn" data-weather="rain">🌧️ 细雨</button>
          <button class="chip-btn" data-weather="storm">⛈️ 雷暴</button>
          <button class="chip-btn" data-weather="snow">❄️ 飘雪</button>
        </div>

        <div class="preset-group" id="camera-presets">
          <button class="chip-btn active" data-cam="overview">🗺️ 全景</button>
          <button class="chip-btn" data-cam="village">🏘️ 小镇</button>
          <button class="chip-btn" data-cam="lighthouse">🚨 灯塔</button>
          <button class="chip-btn" data-cam="waterfall">⛰️ 瀑布</button>
          <button class="chip-btn" data-cam="beach">🔥 海滩</button>
          <button class="chip-btn" data-cam="balloon">🎈 热气球</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
